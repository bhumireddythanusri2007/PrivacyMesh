apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: privacymesh
  labels:
    app.kubernetes.io/name: privacymesh
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    rule_files:
      - "/etc/prometheus/alerts.yml"

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "privacymesh-backend"
        metrics_path: /metrics
        scrape_interval: 10s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - privacymesh
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: backend
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8000"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - target_label: app
            replacement: privacymesh
          - target_label: service
            replacement: backend
          - target_label: env
            replacement: kubernetes

      - job_name: "privacymesh-workload-predictor"
        metrics_path: /metrics
        scrape_interval: 10s
        static_configs:
          - targets: ["workload-predictor:8080"]
            labels:
              app: "privacymesh"
              service: "workload-predictor"
              env: "kubernetes"

      - job_name: "privacymesh-workload-controller"
        metrics_path: /metrics
        scrape_interval: 10s
        static_configs:
          - targets: ["workload-controller:8081"]
            labels:
              app: "privacymesh"
              service: "workload-controller"
              env: "kubernetes"

  alerts.yml: |
    groups:
      - name: privacymesh_alerts
        rules:
          - alert: BackendUnavailable
            expr: up{job="privacymesh-backend"} == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "PrivacyMesh backend service is unreachable"
              description: "FastAPI backend target at backend:8000 has been down for more than 30 seconds."

          - alert: DatabaseUnavailable
            expr: privacymesh_db_connected == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "PostgreSQL database is disconnected or unreachable"
              description: "The backend reports that the database connection check is failing."

          - alert: HighCPUUsage
            expr: privacymesh_process_cpu_percent > 85
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "High backend CPU utilization detected"
              description: "PrivacyMesh backend CPU consumption has exceeded 85% for more than 1 minute."

          - alert: HighMemoryUsage
            expr: privacymesh_process_memory_percent > 85
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "High backend memory consumption detected"
              description: "PrivacyMesh backend host memory consumption has exceeded 85% for more than 1 minute."

          - alert: HighHttp5xxErrorRate
            expr: |
              (
                sum(rate(privacymesh_http_requests_total{status=~"5.."}[2m]))
                /
                clamp_min(sum(rate(privacymesh_http_requests_total[2m])), 0.001)
              ) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High HTTP 5xx error rate detected"
              description: "HTTP 5xx server error rate exceeds 5% of all incoming requests over a 2-minute window."
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-storage
  namespace: privacymesh
  labels:
    app.kubernetes.io/name: privacymesh
    app.kubernetes.io/component: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: privacymesh
  labels:
    app.kubernetes.io/name: privacymesh
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: privacymesh
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: privacymesh
        app.kubernetes.io/component: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
            - "--web.enable-lifecycle"
          ports:
            - name: web
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/alerts.yml
              subPath: alerts.yml
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          persistentVolumeClaim:
            claimName: prometheus-storage
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: privacymesh
  labels:
    app.kubernetes.io/name: privacymesh
    app.kubernetes.io/component: monitoring
spec:
  type: NodePort
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      nodePort: 30090
  selector:
    app.kubernetes.io/name: privacymesh
    app.kubernetes.io/component: prometheus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: privacymesh
  labels:
    app.kubernetes.io/name: privacymesh
    app.kubernetes.io/component: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-reader
  namespace: privacymesh
  labels:
    app.kubernetes.io/name: privacymesh
    app.kubernetes.io/component: monitoring
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-reader-binding
  namespace: privacymesh
  labels:
    app.kubernetes.io/name: privacymesh
    app.kubernetes.io/component: monitoring
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: privacymesh
roleRef:
  kind: Role
  name: prometheus-pod-reader
  apiGroup: rbac.authorization.k8s.io
