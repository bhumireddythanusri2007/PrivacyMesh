apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-predictor
  namespace: privacymesh
  labels:
    app.kubernetes.io/name: privacymesh
    app.kubernetes.io/component: workload-predictor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: privacymesh
      app.kubernetes.io/component: workload-predictor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: privacymesh
        app.kubernetes.io/component: workload-predictor
    spec:
      containers:
        - name: predictor
          image: privacymesh-workload-predictor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: MODEL_PATH
              value: "/app/kyc_workload_xgb.json"
            - name: FEATURES_PATH
              value: "/app/model_features.json"
            - name: PREDICTOR_ENDPOINT_REGEX
              value: ".*submissions.*"
            - name: PREDICTOR_RATE_WINDOW
              value: "5m"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: workload-predictor
  namespace: privacymesh
  labels:
    app.kubernetes.io/name: privacymesh
    app.kubernetes.io/component: workload-predictor
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: privacymesh
    app.kubernetes.io/component: workload-predictor
