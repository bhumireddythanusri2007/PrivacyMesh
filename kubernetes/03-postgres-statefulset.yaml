apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: privacymesh
  labels:
    app.kubernetes.io/name: privacymesh
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: privacymesh
    app.kubernetes.io/component: database
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: privacymesh
  labels:
    app.kubernetes.io/name: privacymesh
data:
  01-init-roles.sh: |
    #!/usr/bin/env bash
    set -e
    echo "Initializing PrivacyMesh database roles and privileges..."
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      DO \$\$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'privacy_owner') THEN
          CREATE ROLE privacy_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
        END IF;
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'privacy_migrator') THEN
          CREATE ROLE privacy_migrator WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
        END IF;
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'privacy_app') THEN
          CREATE ROLE privacy_app WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
        END IF;
      END
      \$\$;

      ALTER ROLE privacy_app WITH PASSWORD '$APP_DB_PASSWORD';
      GRANT USAGE, CREATE ON SCHEMA public TO privacy_owner;
      GRANT USAGE, CREATE ON SCHEMA public TO privacy_app;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO privacy_app;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO privacy_app;
    EOSQL
    echo "Database role initialization completed."
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: privacymesh
  labels:
    app.kubernetes.io/name: privacymesh
    app.kubernetes.io/component: database
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: privacymesh
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: privacymesh
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: privacymesh-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: privacymesh-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: privacymesh-secrets
                  key: POSTGRES_PASSWORD
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: privacymesh-secrets
                  key: APP_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
