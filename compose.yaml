
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://privacy_user:${POSTGRES_PASSWORD}@db:5432/privacymesh
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: privacy_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: privacymesh
    ports:
      - "5433:5432"
    volumes:
      - privacymesh_pgdata:/var/lib/postgresql/data

volumes:
  privacymesh_pgdata:
