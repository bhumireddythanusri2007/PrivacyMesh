global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "privacymesh-backend"
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          app: "privacymesh"
          service: "backend"
          env: "production"

  - job_name: "privacymesh-workload-predictor"
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["workload-predictor:8080"]
        labels:
          app: "privacymesh"
          service: "workload-predictor"
          env: "production"

  - job_name: "privacymesh-workload-controller"
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["workload-controller:8081"]
        labels:
          app: "privacymesh"
          service: "workload-controller"
          env: "production"
